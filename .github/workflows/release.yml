name: release

# Tag pushes build and publish a release. Manual runs build/test both platform
# packages without publishing, so a feature branch can validate installers safely.
on:
  push:
    branches: ["ci/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches repo version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) { throw "tag $tag != tauri.conf.json version $conf (run scripts/bump.ps1 $tag)" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python deps + PyInstaller
        run: pip install -e ".[dev]" pyinstaller

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Backend deps sanity (tests)
        run: python -m pytest tests -q

      - name: Release build (ffmpeg + sidecar + NSIS)
        shell: pwsh
        run: scripts/release.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*-setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils libfuse2 ffmpeg \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install backend + PyInstaller
        run: pip install -e ".[dev]" pyinstaller

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> app/src-tauri/target

      - name: Frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Backend tests
        run: python -m pytest tests -q

      - name: Build and verify Linux packages
        run: bash scripts/release-linux.sh

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: mai2srt ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*
          generate_release_notes: true
